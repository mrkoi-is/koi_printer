name: Koi Printer Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze_and_test:
    name: Analyze and Test Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies (koi_printer_command)
        working-directory: koi_printer_command
        run: dart pub get

      - name: Get dependencies (koi_printer_connection)
        working-directory: koi_printer_connection
        run: flutter pub get

      - name: Get dependencies (koi_printer)
        working-directory: koi_printer
        run: flutter pub get

      - name: Get dependencies (koi_printer_editor)
        working-directory: koi_printer_editor
        run: flutter pub get

      - name: Get dependencies (koi_printer/example)
        working-directory: koi_printer/example
        run: flutter pub get

      - name: Verify Formatting (koi_printer_command)
        working-directory: koi_printer_command
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Formatting (koi_printer_connection)
        working-directory: koi_printer_connection
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Formatting (koi_printer)
        working-directory: koi_printer
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Formatting (koi_printer_editor)
        working-directory: koi_printer_editor
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (koi_printer_command)
        working-directory: koi_printer_command
        run: dart analyze

      - name: Analyze (koi_printer_connection)
        working-directory: koi_printer_connection
        run: flutter analyze

      - name: Analyze (koi_printer)
        working-directory: koi_printer
        run: flutter analyze

      - name: Analyze (koi_printer_editor)
        working-directory: koi_printer_editor
        run: flutter analyze

      - name: Analyze (koi_printer/example)
        working-directory: koi_printer/example
        run: flutter analyze

      - name: Run Tests (koi_printer_command)
        working-directory: koi_printer_command
        run: flutter test --coverage

      - name: Check coverage (koi_printer_command)
        working-directory: koi_printer_command
        run: |
          awk -F':' '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{pct=lh/lf*100; if(pct<90){print "FAIL: "pct"%"; exit 1}else{print "PASS: "pct"%"}}' coverage/lcov.info

      - name: Run Tests (koi_printer_connection)
        working-directory: koi_printer_connection
        run: flutter test --coverage

      - name: Check coverage (koi_printer_connection)
        working-directory: koi_printer_connection
        run: |
          awk -F':' '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{pct=lh/lf*100; if(pct<90){print "FAIL: "pct"%"; exit 1}else{print "PASS: "pct"%"}}' coverage/lcov.info

      - name: Run Tests (koi_printer)
        working-directory: koi_printer
        run: flutter test --coverage

      - name: Check coverage (koi_printer)
        working-directory: koi_printer
        run: |
          awk -F':' '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{pct=lh/lf*100; if(pct<90){print "FAIL: "pct"%"; exit 1}else{print "PASS: "pct"%"}}' coverage/lcov.info

      - name: Run Tests (koi_printer_editor)
        working-directory: koi_printer_editor
        run: flutter test --coverage

      - name: Check coverage (koi_printer_editor)
        working-directory: koi_printer_editor
        run: |
          awk -F':' '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{pct=lh/lf*100; if(pct<90){print "FAIL: "pct"%"; exit 1}else{print "PASS: "pct"%"}}' coverage/lcov.info
