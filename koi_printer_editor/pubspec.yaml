name: koi_printer_editor
description: >
  WYSIWYG visual editor for Koi Printer ecosystem. 
  Supports drag-and-drop ticket/label design, data binding, and remote proofing.
repository: https://github.com/mrkoi-is/koi_printer/tree/main/koi_printer_editor
homepage: https://github.com/mrkoi-is/koi_printer
issue_tracker: https://github.com/mrkoi-is/koi_printer/issues
version: 0.1.0
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  koi_printer: ^0.1.0
  koi_printer_command: ^0.1.0

dependency_overrides:
  koi_printer:
    path: ../koi_printer
  koi_printer_command:
    path: ../koi_printer_command
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
  fonts:
    - family: SarasaMono
      fonts:
        - asset: assets/fonts/sarasa-mono-sc-regular.ttf
